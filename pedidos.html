<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía 2 - Pedidos | Panadería Santa Rosa</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <p><strong>Panadería Santa Rosa </strong></p>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html">Productos</a></li>
                <li><a href="pedidos.html">Pedidos</a></li>
                <li><a href="index.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <script src="js/app.js" defer></script>

    <main>
        <h1>Haz tu pedido</h1>
        <p>Te confirmaremos por WhatsApp en menos de una hora.</p>

        <form action="#" class="form-dos-columnas">
            <fieldset>
                <legend>Tus datos</legend>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required aria-describedby="error-nombre">
                <p class="error" id="error-nombre"></p>
                <label for="celular">Celular</label>
                <input type="tel" id="celular" name="celular" required aria-describedby="error-celular">
                <p class="error" id="error-celular"></p>
            </fieldset>

            <fieldset>
                <legend>Tu pedido</legend>
                <label for="producto">Producto</label>
                <select id="producto" name="producto" required aria-describedby="error-producto">
                    <p class="error" id="error-producto"></p>
                    <option value="">Elige un producto</option>
                    <option>Pan francés</option>
                    <option>Pan de yema</option>
                    <option disabled>Chancay (Agotado)</option>
                    <option>Torta de chocolate</option>
                </select>

                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" name="cantidad" min="1" value="1" required
                    aria-describedby="error-cantidad">
                <p class="error" id="error-cantidad"></p>
                <label for="fecha">Fecha de recojo</label>
                <input type="date" id="fecha" name="fecha" required aria-describedby="error-fecha">
                <p class="error" id="error-fecha"></p>
                <label for="notas">Indicaciones (opcional)</label>
                <textarea id="notas" name="notas" rows="3"></textarea>
            </fieldset>

            <div class="check-container">
                <input type="checkbox" id="consentimiento" name="consentimiento" required
                    aria-describedby="error-consentimiento">
                <label for="consentimiento">Autorizo que usen mis datos solo para atender este pedido.</label>
                <p class="error-consentimiento"></p>
            </div>

            <div id="estado" role="status">
                <button type="submit">Enviar pedido</button>
            </div>
        </form>
    </main>

    <footer>
        <h2>Visítanos</h2>
        <address>
            Av. Los Panaderos 123, San Miguel<br>
            Celular: <a href="tel:+51900000000">900 000 000</a>
        </address>
        <p>Lunes a sábado de 6:00 a 21:00 | Domingos de 6:00 a 13:00</p>
    </footer>

</body>

</html>
